<style>

#friend-form { display: flex; gap: 8px; margin-bottom: 8px; }

.friend .st { width: 9px; height: 9px; border-radius: 50%; background: #566074; flex: none; } .friend .st.online { background: var(--good); box-shadow: 0 0 8px var(--good); } .friend .st.busy { background: var(--warn); }
.friend .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .friend small { color: var(--dim); font-weight: 500; }
.request { border: 1px solid rgba(var(--accent-rgb), .4); } .request .nm { flex: 1; }
.empty { color: var(--dim); font-size: 13px; padding: 6px 2px; }

.res i { font-style: normal; font-size: 18px; width: 24px; text-align: center; } .res small { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--dim); }

.bar { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .12); overflow: hidden; margin-top: 7px; } .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .2s linear; }
.base-box { min-width: 210px; display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.base { padding: 8px 14px 10px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(8px); }

.base .bar i { background: linear-gradient(90deg, #ff5d5d, #ffb05d 50%, #6dff8f); background-size: 210px 100%; }
.base.foe .l span { color: var(--accent-2); } .base .sub { font-size: 12px; color: var(--dim); margin-top: 5px; }
#feed { position: absolute; left: 16px; top: 190px; display: flex; flex-direction: column; gap: 4px; max-width: 320px; }
#feed div { padding: 4px 10px; border-radius: 8px; background: rgba(0, 0, 0, .5); font-size: 13px; animation: fadeout 7s forwards; }
@keyframes fadeout { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
#banner { position: absolute; top: 24%; left: 0; right: 0; text-align: center; opacity: 0; }
#banner.show { animation: banner 3.2s ease-out; }
#banner .b1 { font-family: var(--title-font); font-size: clamp(34px, 5.4vw, 64px); font-weight: 800; letter-spacing: .24em; background: var(--title-grad); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 16px rgba(0, 0, 0, .7)); }
#banner .b2 { font-size: clamp(14px, 1.6vw, 20px); font-weight: 700; letter-spacing: .12em; text-shadow: 0 2px 10px #000; margin-top: 4px; }
@keyframes banner { 0% { opacity: 0; transform: scale(1.25); } 10% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(.98) translateY(-8px); } }
#cross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; }
#cross::before, #cross::after { content: ''; position: absolute; background: rgba(255, 255, 255, .9); box-shadow: 0 0 4px #000; }
#cross::before { left: 10px; top: 0; width: 2px; height: 22px; clip-path: polygon(0 0, 100% 0, 100% 36%, 0 36%, 0 64%, 100% 64%, 100% 100%, 0 100%); }
#cross::after { top: 10px; left: 0; height: 2px; width: 22px; clip-path: polygon(0 0, 36% 0, 36% 100%, 0 100%, 64% 0, 100% 0, 100% 100%, 64% 100%); }
#cross.node::before, #cross.node::after { background: var(--good); } #cross.tower::before, #cross.tower::after { background: var(--accent); } #cross.bad::before, #cross.bad::after { background: var(--bad); }
#prompt { position: absolute; left: 50%; bottom: 164px; transform: translateX(-50%); text-align: center; min-width: 280px; max-width: 560px; padding: 9px 16px; border-radius: 12px; background: rgba(8, 11, 18, .72); border: 1px solid var(--line); font-size: 14px; font-weight: 600; line-height: 1.5; backdrop-filter: blur(6px); }
#prompt b { color: var(--accent); } #prompt .bad { color: var(--bad); } #prompt .good { color: var(--good); } #prompt .dim { font-weight: 500; }
#prompt .stats { display: flex; justify-content: center; gap: 14px; color: var(--dim); font-weight: 600; font-size: 13px; }
#hotbar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; }
.slot { position: relative; width: 118px; padding: 6px 4px 7px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); text-align: center; backdrop-filter: blur(8px); pointer-events: auto; transition: .12s; }
.slot img, .slot .sw { display: block; width: 48px; height: 48px; margin: 0 auto 2px; object-fit: contain; } .slot .sw { border-radius: 10px; background: var(--c); opacity: .7; }
.slot .k { position: absolute; left: 6px; top: 4px; font-size: 11px; font-weight: 800; color: var(--dim); } .slot .n { font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
.slot .cost { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; margin-top: 3px; }
.slot .chip { font-size: 10.5px; padding: 1px 5px; white-space: nowrap; }
.slot.on { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(var(--accent-rgb), .6), 0 0 22px rgba(var(--accent-rgb), .35); transform: translateY(-6px); } .slot.poor { opacity: .72; }
#minimap { position: absolute; left: 16px; bottom: 14px; width: 176px; height: 176px; border-radius: 14px; border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0, 0, 0, .45); background: #0a0e18; }
#sendbar { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 7px; }
#sendbar .send { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 11px; background: var(--glass); border: 1px solid var(--line); font-size: 13px; font-weight: 700; min-width: 210px; backdrop-filter: blur(8px); transition: .15s; }
#sendbar .send img { width: 38px; height: 38px; object-fit: contain; } #sendbar .send .k { color: var(--accent-2); font-weight: 800; width: 14px; } #sendbar .send .cost { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 2px; }
#sendbar .send.cd { opacity: .5; } #sendbar .send.ok { border-color: rgba(var(--accent-rgb), .45); } #sendbar h4 { margin: 0 0 1px; font-size: 11px; letter-spacing: .22em; color: var(--accent-2); text-align: right; text-transform: uppercase; }

/* ---------- overlays, toasts ---------- */
#overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(3, 5, 10, .62); backdrop-filter: blur(5px); z-index: 20; }
.card { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; padding: 26px 28px; border-radius: 18px; background: var(--glass-hi); border: 1px solid var(--line); box-shadow: 0 20px 70px rgba(0, 0, 0, .6); text-align: center; }
.card h1 { margin: 0 0 4px; font-family: var(--title-font); font-size: 40px; letter-spacing: .2em; background: var(--title-grad); -webkit-background-clip: text; background-clip: text; color: transparent; } .card h1.bad { background: linear-gradient(180deg, #ff9a9a, #d83a3a); -webkit-background-clip: text; background-clip: text; }
.card p { margin: 6px 0; color: var(--dim); line-height: 1.5; } .card .row { display: flex; gap: 10px; margin-top: 18px; } .card .row > * { flex: 1; }
.card .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 16px 0 4px; } .card .grid div { padding: 10px; border-radius: 10px; background: rgba(255, 255, 255, .06); } .card .grid b { display: block; font-size: 22px; color: var(--text); } .card .grid span { font-size: 11.5px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.card input { width: 100%; margin-top: 14px; padding: 12px 14px; font-size: 18px; text-align: center; border-radius: 12px; border: 1px solid var(--line); background: rgba(0, 0, 0, .45); outline: none; user-select: text; } .card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .22); }

.toast { padding: 8px 16px; border-radius: 10px; background: rgba(8, 11, 18, .88); border: 1px solid var(--line); font-size: 14px; font-weight: 600; animation: toast 3.6s forwards; box-shadow: 0 6px 20px rgba(0, 0, 0, .4); }
.toast.warn { border-color: var(--warn); color: var(--warn); } .toast.good { border-color: rgba(109, 255, 143, .6); color: var(--good); }

@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 8%, 82% { opacity: 1; transform: none; } 100% { opacity: 0; } }

<div id="menu">
  <header class="topbar">
    <div class="brand"><span class="logo">TIMEFALL</span><span class="tagline" id="tagline"></span></div>
    <div class="top-right">
      <div class="seg" id="era-toggle" role="group" aria-label="Game mode">

      <button id="gfx" class="icon-btn gfx-btn" title="Graphics quality" aria-label="Graphics quality">HIGH</button>
      <button id="mute" class="icon-btn" title="Mute / unmute music" aria-label="Toggle sound">🔊</button>
    </div>
  </header>
  <main class="menu-main">
    <section class="panel">
      <div class="panel-head"><h2>Deploy</h2><button id="who" class="who" title="Change display name"><span class="dot"></span><span id="who-name">Pick a name</span> ✎</button></div>
      <div class="seg wide" id="diff-tabs" role="group" aria-label="Difficulty"></div>
      <div id="diff-info" class="dim"></div>
      <div id="map-grid" class="map-grid"></div>
      <button id="start" class="cta">▶ Start</button>
    </section>
    <div class="side">
    <section class="panel">
      <div class="panel-head"><h2>Duel</h2><span id="net-pill" class="pill">offline</span></div>
      <button id="quick" class="cta alt" disabled>⚡ Quick Match</button>
      <p class="dim small" style="margin:8px 2px 0">Face a random player who is also searching. Same map, same waves.</p>
      <h3>Friends</h3>
      <form id="friend-form" autocomplete="off"><input id="friend-input" maxlength="16" placeholder="Add a friend by name"><button class="btn" type="submit">Add</button></form>
      <div id="requests"></div>
      <div id="friends" class="friends"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Arsenal</h2><span class="dim small" id="arsenal-sub"></span></div>
      <div class="arsenal" id="arsenal"></div>
    </section>
    </div>
  </main>
  <footer>
    <div class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp; <kbd>Shift</kbd> sprint &nbsp; <kbd>Space</kbd> jump &nbsp; <kbd>LMB</kbd> gather / place &nbsp; <kbd>1</kbd>&ndash;<kbd>6</kbd> build &nbsp; <kbd>F</kbd> upgrade &nbsp; <kbd>R</kbd> sell &nbsp; <kbd>N</kbd> call wave</div>
  </footer>
</div>

<div id="hud" class="hidden"></div>
<div id="overlay" class="hidden"><div class="card" id="card"></div></div>
<div id="toasts"></div>
<div id="loading" class="hidden"><div class="spin"></div>Forging the timeline&hellip;</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
